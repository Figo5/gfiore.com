name: Refresh public GitHub data

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-data.yml'
      - 'scripts/update-github-feed.mjs'
      - 'app/github-data-core.ts'
      - 'app/github-types.ts'

permissions:
  contents: read

concurrency:
  group: public-github-data
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Figo5/gfiore.com' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Refresh and publish the public feed
        run: node --experimental-transform-types scripts/update-github-feed.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
